<script>
    $(function () {
        $('#cancel').on("click", closeDialog);
        $('#save').on("click", savePreferences);
    });

    function savePreferences() {
        setLoading(true)

        const ignoredTags = []
        $.each($("input[name='ignoredTag']:not(:checked)"), function() {
            const tags = $(this).val().split(",")
            ignoredTags.push(...tags)
        })

        const useBetaApi = $("input[name='useBetaApi']").is(':checked')

        google.script.run
            .withSuccessHandler(function () {
                google.script.host.close()
            })
            .withFailureHandler(function(msg) {
                showError(msg, $('#button-bar'));
                setLoading(false)
            })
            .savePreferences(ignoredTags, useBetaApi);

    }

    function closeDialog() {
        google.script.host.close()
    }

    function setLoading(loading) {
        const dialog = $(".dialog")
        if (loading) {
            disableAll(dialog)
        } else {
            enableAll(dialog)
        }
    }
</script>
