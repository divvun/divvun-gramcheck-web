<script>
    // Track last operation context for retry
    let lastOperation = null;
    let currentError = null;

    $(function () {
        $('#run-check').on("click", runGrammarCheck);
        $('#open-preferences').on("click", openPreferences);
        $('select[name="language"]').on("change", selectedLanguageChanged);
        $('#error-retry').on("click", handleRetry);
        $('#error-dismiss').on("click", handleDismissError);

        setLoading(true)
        refreshLanguagesList(function () {
            loadSettings(function() {
                setLoading(false)
            });
        });
    });

    function getErrorIcon(errorType) {
        switch (errorType) {
            case 'NETWORK_ERROR': return '🔌';
            case 'TIMEOUT_ERROR': return '⏱️';
            case 'API_ERROR': return '⚠️';
            case 'PARSE_ERROR': return '❌';
            default: return '⚠️';
        }
    }

    function displayTypedError(error) {
        if (!error) {
            hideError();
            return;
        }

        currentError = error;
        const container = $('#error-container');

        // Set appropriate styling based on retryable status
        container.removeClass('error-retryable error-fatal visible');
        container.addClass(error.retryable ? 'error-retryable' : 'error-fatal');
        container.addClass('visible');

        // Set content
        container.find('.error-icon').text(getErrorIcon(error.type));
        container.find('.error-user-message').text(error.userMessage);

        if (error.statusCode) {
            container.find('.error-code').text('(Error ' + error.statusCode + ')').show();
        } else {
            container.find('.error-code').hide();
        }

        // Show/hide retry button based on retryable status
        if (error.retryable) {
            $('#error-retry').show();
        } else {
            $('#error-retry').hide();
        }
    }

    function hideError() {
        currentError = null;
        $('#error-container').removeClass('visible');
    }

    function handleRetry() {
        hideError();

        if (lastOperation === 'grammarCheck') {
            runGrammarCheck();
        } else if (lastOperation === 'loadLanguages') {
            setLoading(true);
            refreshLanguagesList(function() {
                loadSettings(function() {
                    setLoading(false);
                });
            });
        }
    }

    function handleDismissError() {
        hideError();
    }

    function selectedLanguageChanged() {
        const lang = $('select[name="language"] option:selected').val();
        setLoading(true)

        $('#error').remove();
        $('#results').html("")

        google.script.run
            .withSuccessHandler(function() {
                setLoading(false)
            })
            .withFailureHandler(function(msg, element) {
                showError(msg, element);
                setLoading(false)
            })
            .withUserObject(this)
            .changeLanguage(lang);

    }

    function loadSettings(onSuccess, onFailure) {
        const select = $('select[name="language"]')
        google.script.run
            .withSuccessHandler(
                function (result, element) {
                    element.val(result)
                    if (onSuccess)
                        onSuccess()
                })
            .withFailureHandler(onFailure)
            .withUserObject(select)
            .getSelectedLanguage();
    }

    function refreshLanguagesList(onSuccess, onFailure) {
        lastOperation = 'loadLanguages';
        const select = $('select[name="language"]')
        google.script.run
            .withSuccessHandler(
                function (result, element) {
                    const languages = result.available.grammar
                    element.empty()
                    for (const lang in languages) {
                        element.append(new Option(languages[lang], lang))
                    }
                    hideError();
                    if (onSuccess)
                        onSuccess()
                })
            .withFailureHandler(function(msg, element) {
                setLoading(false);
                // Handle error object or plain message
                if (msg && typeof msg === 'object' && msg.userMessage) {
                    displayTypedError(msg);
                } else {
                    showError(msg, $('#button-bar'));
                }
                if (onFailure)
                    onFailure(msg, element);
            })
            .withUserObject(select)
            .apiRequestLanguageOptions();
    }

    function openPreferences() {
        setLoading(true)
        google.script.run
            .withSuccessHandler(function() {
                setLoading(false)
            })
            .withFailureHandler(
                function (msg) {
                    setLoading(false)
                    showError(msg, $('#button-bar'));
                })
            .showPreferences();
    }

    function runGrammarCheck() {
        setLoading(true)
        hideError();
        lastOperation = 'grammarCheck';

        const lang = $('select[name="language"] option:selected').val();
        google.script.run
            .withSuccessHandler(
                function (result, element) {
                    setLoading(false)

                    // Handle structured response
                    if (result && typeof result === 'object') {
                        $('#results').html(result.html);

                        // Display error if present
                        if (result.error) {
                            displayTypedError(result.error);
                        }
                    } else {
                        // Legacy: plain HTML string response
                        $('#results').html(result);
                    }

                    $('.suggestion').on("click", runCorrection);
                    $('.grammar-error').on("mouseenter", highlightError).on("mouseleave", clearHighlight);
                })
            .withFailureHandler(
                function (msg, element) {
                    setLoading(false)
                    // Handle error object or plain message
                    if (msg && typeof msg === 'object' && msg.userMessage) {
                        displayTypedError(msg);
                    } else {
                        showError(msg, $('#button-bar'));
                    }
                })
            .withUserObject(this)
            .runGrammarCheckOnWholeText(lang);
    }

    function runCorrection() {
        const errorText = $(this).attr('data-error-text');
        const errorIndex = $(this).attr('data-error-index');
        const errorParagraphIndex = $(this).attr('data-error-paragraph-index');
        const correction = $(this).attr('data-correction');
        const parentIndex = $(this).attr('data-parent-index');
        const parent = $(this).closest('.grammar-error');

        setLoading(true)
        google.script.run
            .withSuccessHandler(function () {
                parent.slideUp(300, function () {
                    runGrammarCheck();
                    parent.remove();
                });
                setLoading(false)
            })
            .withFailureHandler(function (message) {
                showError(message, this);
                setLoading(false)
            })
            .withUserObject(this)
            .runCorrection(errorText, correction, errorIndex, errorParagraphIndex);
    }

    function highlightError() {
        const errorText = $(this).attr('data-error-text');
        const errorIndex = $(this).attr('data-error-index');
        const errorParagraphIndex = $(this).attr('data-error-paragraph-index');

        google.script.run
            .highlightError(errorText, errorIndex, errorParagraphIndex);
    }

    function clearHighlight() {
        google.script.run
            .clearHighlight();
    }

    function setLoading(loading) {
        const sidebar = $(".sidebar")
        if (loading) {
            showLoading()
            disableAll(sidebar)
        } else {
            hideLoading()
            enableAll(sidebar)
        }
    }
</script>
