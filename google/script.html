<script>
    function showError(msg, element) {
        $('#error').remove();
        const text = (msg && msg.message) ? msg.message : String(msg);
        const div = $('<div id="error" class="error"></div>').text(text);
        $(element).after(div);
    }

    function disableAll(element) {
        $(element).find("*").prop("disabled", true)
    }

    function enableAll(element) {
        $(element).find("*").prop("disabled", false)
    }

    function showLoading() {
        $('#loadingAnimation').show();
    }
    function hideLoading() {
        $('#loadingAnimation').hide();
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>
